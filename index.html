<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050e19"><meta name="description" content="把星光挂满枝头，送给亲爱的乖老婆的圣诞祝福。">
<title>亲爱的乖老婆圣诞快乐 · A little Christmas magic</title>
<style>
:root{color-scheme:dark;--gold:#ead4a2;--muted:#8b9aab}*{box-sizing:border-box}body{margin:0;background:#050e19;color:#f5ead4;font-family:'Noto Serif SC','Songti SC','SimSun',serif;overflow:hidden}main{height:100svh;min-height:560px;position:relative;isolation:isolate;overflow:hidden;background:radial-gradient(ellipse at 50% 54%,#102b30 0, #091722 35%,#050e19 70%)}main:after{content:'';position:absolute;inset:15px;border:1px solid #cfbc8820;pointer-events:none;z-index:4}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:pan-y}header{position:absolute;left:7%;right:7%;top:38px;display:flex;justify-content:space-between;align-items:center;z-index:5;font-family:Georgia,serif;color:var(--gold);font-size:11px;letter-spacing:.25em}.brand{display:flex;gap:12px;align-items:center}.brand span{font-size:23px}.edition{color:#a1adba;font-size:10px}.greeting{position:absolute;top:12%;left:0;right:0;text-align:center;z-index:2;pointer-events:none}.eyebrow{font:10px Georgia,serif;letter-spacing:.45em;color:#b5b6a4;margin:0 0 17px}h1{font-weight:500;font-size:clamp(28px,4vw,48px);letter-spacing:.13em;margin:0;text-shadow:0 0 32px #efd69b35}h1 span{color:#efd3a0}.subtitle{font-size:12px;letter-spacing:.2em;color:#9faeb3;margin:15px 0 0}.script{position:absolute;top:45%;left:9%;font-style:italic;font-family:Georgia,serif;line-height:1.5;font-size:clamp(18px,2.4vw,32px);color:#d9caa587;transform:rotate(-8deg);pointer-events:none}.script small{display:block;font:9px Georgia,serif;letter-spacing:.2em;margin-top:18px;color:#8d9c9c}.right-note{position:absolute;right:9%;top:51%;writing-mode:vertical-rl;font-size:12px;letter-spacing:.4em;color:#c7bea580;pointer-events:none}.bottom{position:absolute;bottom:6%;left:0;right:0;z-index:5;display:flex;align-items:center;flex-direction:column;gap:16px}.wish{margin:0;color:#c8d0ca;font-size:12px;letter-spacing:.22em;min-height:22px;transition:opacity .3s}.controls{display:flex;gap:12px}button{border:1px solid #d8c08a5c;background:#13212ab3;color:#eddbb5;cursor:pointer;padding:11px 24px;border-radius:30px;font:12px 'Noto Serif SC','SimSun',serif;letter-spacing:.15em;backdrop-filter:blur(12px);transition:background .2s,transform .2s}button:hover{background:#344035;transform:translateY(-2px)}button:focus-visible{outline:2px solid #efd3a0;outline-offset:5px}.pause{padding:11px 15px;font-family:system-ui;font-size:12px;color:#b0bab9}.footer{position:absolute;bottom:27px;left:7%;right:7%;display:flex;justify-content:space-between;font:9px Georgia,serif;letter-spacing:.18em;color:#6e818b;z-index:4}.hint{position:absolute;top:72%;left:7%;font-size:10px;color:#7d959f;letter-spacing:.14em}.hint:before{content:'';display:inline-block;width:25px;height:1px;background:#7d959f;margin-right:10px;vertical-align:middle}@media(max-width:600px){header{top:29px;left:8%;right:8%}.edition{letter-spacing:.13em;font-size:8px}.greeting{top:13%}h1{font-size:29px;letter-spacing:.06em}.eyebrow{font-size:8px;letter-spacing:.3em}.subtitle{font-size:10px;letter-spacing:.1em}.script,.right-note,.hint{display:none}.bottom{bottom:8%;gap:12px}.wish{font-size:11px;letter-spacing:.09em}.footer{bottom:29px;font-size:7px}.controls button{font-size:11px}main:after{inset:10px}}@media(max-height:650px){.greeting{top:11%}.subtitle{margin-top:8px}.bottom{bottom:7%}.eyebrow{margin-bottom:9px}header{top:23px}.footer{bottom:20px}}@media(prefers-reduced-motion:reduce){button{transition:none}}
@media(max-width:600px){h1{font-size:clamp(20px,7.2vw,29px);letter-spacing:.03em;padding:0 12px}.wish{max-width:calc(100% - 36px);text-align:center}}
</style>
</head>
<body><main>
<canvas id="scene" aria-label="由金色与绿色星光粒子组成的圣诞树，树顶星星闪耀，雪花缓缓飘落"></canvas>
<header><div class="brand"><span>✧</span> CHRISTMAS</div><div class="edition">A LITTLE WINTER MAGIC</div></header>
<section class="greeting"><p class="eyebrow">A CHRISTMAS WISH, JUST FOR YOU</p><h1>亲爱的乖老婆<span>圣诞快乐</span></h1><p class="subtitle">把星光挂满枝头，把温柔留给你。</p></section>
<div class="script">May your days<br>be merry & bright.<small>WITH LOVE, ALWAYS</small></div>
<div class="right-note">愿你所遇皆暖 · 所念皆如愿</div><div class="hint">轻触夜空，落下星光</div>
<div class="bottom"><p class="wish" id="wish" aria-live="polite">今夜的每一颗星，都在为你闪烁。</p><div class="controls"><button id="magic">✧ &nbsp; 收下一份圣诞魔法</button><button class="pause" id="pause" aria-label="暂停动画" aria-pressed="false">Ⅱ</button></div></div>
<footer class="footer"><span>FOR 亲爱的乖老婆</span><span>PEACE · LOVE · A LITTLE MAGIC</span></footer>
</main>
<script>
'use strict';
const canvas=document.querySelector('#scene'),ctx=canvas.getContext('2d'),reduced=matchMedia('(prefers-reduced-motion: reduce)');
let w=0,h=0,dpr=1,time=0,last=0,paused=reduced.matches,burst=[],flare=0,raf=0,pointer={x:0,y:0};
const random=(a,b)=>a+Math.random()*(b-a),TAU=Math.PI*2;
const needles=Array.from({length:2300},()=>{const y=Math.pow(Math.random(),.8);return {y,a:random(0,TAU),r:Math.sqrt(Math.random()),s:random(.45,1.65),p:random(0,TAU),gold:Math.random()<.18}});
const bulbs=Array.from({length:95},()=>({y:random(.1,.97),a:random(0,TAU),s:random(1.2,2.5),p:random(0,TAU),c:Math.random()<.3?'#eaa8a3':'#ffe5a6'}));
const snow=Array.from({length:130},()=>({x:Math.random(),y:Math.random(),s:random(.4,1.65),v:random(.015,.055),p:random(0,TAU)}));
const stars=Array.from({length:85},()=>({x:Math.random(),y:Math.random(),s:random(.3,1.05),p:random(0,TAU)}));
const glow=document.createElement('canvas');glow.width=glow.height=64;const gc=glow.getContext('2d'),gg=gc.createRadialGradient(32,32,0,32,32,32);gg.addColorStop(0,'#fff7dd');gg.addColorStop(.08,'#ffe0a9');gg.addColorStop(.23,'#edbc6c88');gg.addColorStop(1,'#edbc6c00');gc.fillStyle=gg;gc.fillRect(0,0,64,64);
function resize(){w=innerWidth;h=Math.max(560,innerHeight);dpr=Math.min(devicePixelRatio||1,2);canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);if(paused)draw(0)}
function layout(){return {cx:w*.5,top:h*.32,th:h*.43,rad:Math.min(w*.28,h*.225)}}
function radius(y){return (Math.pow(y,.86)*(.86+.14*Math.sin(y*TAU*5)))*layout().rad}
function project(y,a,r=1){const L=layout(),angle=a+time*.12+pointer.x*.16;const z=Math.cos(angle)*r;return {x:L.cx+Math.sin(angle)*radius(y)*r, y:L.top+y*L.th+z*radius(y)*.14,z}}
function dot(x,y,size,color,alpha=1){ctx.globalAlpha=Math.max(0,Math.min(1,alpha));ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,Math.max(.1,size),0,TAU);ctx.fill()}
function sparkle(x,y,r,a=1){ctx.globalAlpha=a;ctx.drawImage(glow,x-r*5,y-r*5,r*10,r*10);ctx.strokeStyle='#fff2ce';ctx.lineWidth=.7;ctx.beginPath();ctx.moveTo(x-r,y);ctx.lineTo(x+r,y);ctx.moveTo(x,y-r);ctx.lineTo(x,y+r);ctx.stroke()}
function draw(dt){const L=layout();ctx.clearRect(0,0,w,h);ctx.globalAlpha=1;
for(const s of stars)dot(s.x*w,s.y*h,s.s,'#d9e5e5',.12+.22*(1+Math.sin(time*.6+s.p))/2);
ctx.save();ctx.translate(L.cx,L.top+L.th+17);ctx.scale(1,.17);const halo=ctx.createRadialGradient(0,0,0,0,0,L.rad*1.4);halo.addColorStop(0,'#b8ae6d20');halo.addColorStop(.5,'#5fbd9d13');halo.addColorStop(1,'#5fbd9d00');ctx.fillStyle=halo;ctx.globalAlpha=1;ctx.beginPath();ctx.arc(0,0,L.rad*1.4,0,TAU);ctx.fill();ctx.restore();
for(let i=0;i<160;i++){const a=i/160*TAU;dot(L.cx+Math.cos(a)*L.rad*1.1,L.top+L.th+20+Math.sin(a)*L.rad*.15,.6,'#dcc38c',.18+.2*Math.sin(a+time)**2)}
for(const p of needles){const q=project(p.y,p.a,p.r);const bright=.45+.55*(q.z+1)/2;dot(q.x,q.y,p.s*(.8+.3*(q.z+1)/2),p.gold?'#dfc589':q.z>0?'#8bceb0':'#407c72',bright*(.5+.5*Math.sin(time*.9+p.p)**2))}
for(let i=0;i<600;i++){const y=i/600,a=y*TAU*4.7;const q=project(y,a,1.035);dot(q.x,q.y,.9,'#ffe1a0',q.z<0?.18:.85);if(i%21===0&&q.z>0)sparkle(q.x,q.y,2.4,.8)}
for(const p of bulbs){const q=project(p.y,p.a,1.02);if(q.z<-.3)continue;const alpha=.55+.45*Math.sin(time*1.1+p.p)**2;dot(q.x,q.y,p.s,p.c,alpha);ctx.globalAlpha=alpha*.7;ctx.drawImage(glow,q.x-13,q.y-13,26,26)}
for(let i=0;i<30;i++){const a=i*.9+time*.16;const r=L.rad*(.9+(i%7)*.045);dot(L.cx+Math.cos(a)*r,L.top+L.th*.6+Math.sin(a)*L.th*.48,1,'#e5c789',.3)}
const sy=L.top-8;ctx.globalAlpha=.7+.15*Math.sin(time*1.5);ctx.drawImage(glow,L.cx-65,sy-65,130,130);ctx.globalAlpha=1;ctx.fillStyle='#ffe4a5';ctx.shadowColor='#ffd789';ctx.shadowBlur=20;ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?7:17;const x=L.cx+Math.cos(a)*r,y=sy+Math.sin(a)*r;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath();ctx.fill();ctx.shadowBlur=0;
for(const s of snow){if(dt)s.y=(s.y+dt*s.v)%1;dot(s.x*w+Math.sin(time*.35+s.p)*14,s.y*h,s.s,'#edf6fa',.16+s.s*.16)}
burst=burst.filter(p=>p.life>0);for(const p of burst){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=25*dt;dot(p.x,p.y,p.s,'#ffe5ad',Math.min(1,p.life));if(p.s>1.8)sparkle(p.x,p.y,2,Math.max(0,Math.min(1,p.life*.5)))}
if(flare>0){ctx.globalAlpha=flare*.07;ctx.fillStyle='#ffedbb';ctx.fillRect(0,0,w,h);flare=Math.max(0,flare-dt*.6)}ctx.globalAlpha=1;
}
function frame(now){const dt=Math.min((now-last)/1000||0,.04);last=now;if(!paused){time+=dt;draw(dt);raf=requestAnimationFrame(frame)}}
function start(){cancelAnimationFrame(raf);last=performance.now();if(!paused)raf=requestAnimationFrame(frame);else draw(0)}
function explode(x,y,n=90){if(paused)return;for(let i=0;i<n;i++){const a=random(0,TAU),v=random(20,145);burst.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-25,life:random(.8,2.5),s:random(.6,2.4)})}if(burst.length>700)burst.splice(0,burst.length-700)}
canvas.addEventListener('pointerdown',e=>explode(e.clientX,e.clientY));canvas.addEventListener('pointermove',e=>{pointer.x=(e.clientX/w-.5);pointer.y=(e.clientY/h-.5)});
const wishes=['亲爱的乖老婆，愿你的冬天有暖阳，心里有星光。','愿所有的小美好，都如约来到你身边。','把这一整棵树的温柔，都送给你。','圣诞快乐，亲爱的乖老婆。你值得所有偏爱。'];let wishIndex=0;
document.querySelector('#magic').addEventListener('click',()=>{document.querySelector('#wish').textContent=wishes[wishIndex++%wishes.length];const L=layout();explode(L.cx,L.top+L.th*.35,200);flare=1});
const pause=document.querySelector('#pause');function updatePause(){pause.textContent=paused?'▷':'Ⅱ';pause.setAttribute('aria-label',paused?'播放动画':'暂停动画');pause.setAttribute('aria-pressed',String(paused))}pause.addEventListener('click',()=>{paused=!paused;updatePause();start()});reduced.addEventListener('change',e=>{paused=e.matches;updatePause();start()});document.addEventListener('visibilitychange',()=>{if(document.hidden)cancelAnimationFrame(raf);else start()});addEventListener('resize',resize);resize();updatePause();start();
</script></body></html>
